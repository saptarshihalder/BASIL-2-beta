ch: 64
repr_blocks: 4
dyn_blocks: 2
n_ricks: 5
prior_scale: 1.0
train_universes: 400
iterations: 120
games_per_iter: 96
sims: 96
temp_moves: 6
replay_positions: 150000
train_steps: 300
batch: 256
unroll: 4
lr: 0.0007
gate_positions: 4000
